# Settings for both halves of the Corne. See https://zmk.dev/docs/config

# nice!view screens: Strata (fetched in west.yml). Left: USB/Bluetooth, the 5 Bluetooth profiles, a tile per layer
# (Lower at the bottom, Base above it, BT on top) and the battery. Right: its link and battery under lines that move
# once when it starts or connects, then stay still.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_NICE_VIEW_WIDGET_STATUS=n
CONFIG_NICE_VIEW_STRATA=y

# Deep sleep after 15 minutes idle to save battery. A key press wakes it (that press is not typed).
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
