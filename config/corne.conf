# Settings for both halves of the Corne. See https://zmk.dev/docs/config

# nice!view screens use nice-view-gem (copy in boards/shields/nice_view_gem) instead of the stock look
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# WPM chart and gauge range: 0-80 (about double the 41 WPM starting point)
CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=80
# Right half: a still picture (screen/make_image.py) instead of the crystal animation, to save battery
CONFIG_NICE_VIEW_GEM_ANIMATION=n

# Deep sleep after 15 minutes idle to save battery. A key press wakes it (that press is not typed).
# CONFIG_ZMK_SLEEP=y
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
